name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    name: Full release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.92.0
      - run: npm ci
      - name: Install checksum-verified cargo-deny
        run: ./ops/install-cargo-deny.sh "$RUNNER_TEMP/cargo-deny"
      - name: Audit Rust dependencies and licenses
        run: >-
          "$RUNNER_TEMP/cargo-deny"
          --manifest-path apps/server-rust/Cargo.toml
          check advisories licenses sources
      - run: bun run check
      - run: BLACKGLASS_TESTED_SOURCE_REVISION="$GITHUB_SHA" ./ops/build-release.sh
      - run: bun run server:measure
      - run: shellcheck ops/*.sh
      - name: Verify systemd hardening unit
        run: |
          sudo systemd-sysusers "$PWD/ops/blackglass-server.sysusers.conf"
          sudo install -D -m 0755 \
            "$PWD/apps/server-rust/target/release/blackglass-server" \
            /opt/blackglass-server/blackglass-server
          sudo install -D -m 0600 \
            "$PWD/ops/blackglass-server.env.example" \
            /etc/blackglass-server/server.env
          systemd-analyze verify "$PWD/ops/blackglass-server.service"
      - name: Validate example Caddy ingress
        run: >-
          docker run --rm
          -v "$PWD/ops/Caddyfile.example:/etc/caddy/Caddyfile:ro"
          caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  package:
    name: Package ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - run: npm ci
      - run: BLACKGLASS_TESTED_SOURCE_REVISION="$GITHUB_SHA" ./ops/build-linux-release.sh "${{ matrix.target }}"
      - name: Qualify the exact exported binary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t binaries < <(find artifacts/releases -maxdepth 1 -type f -name "blackglass-server-v*-${{ matrix.target }}")
          test "${#binaries[@]}" -eq 1
          chmod 0555 "${binaries[0]}"
          BLACKGLASS_RUST_BINARY="${binaries[0]}" \
            BLACKGLASS_EXPECTED_SOURCE_REVISION="$GITHUB_SHA" \
            bun test \
              tests/rust-server.integration.test.ts \
              tests/database-migration.integration.test.ts \
              tests/server-parity.integration.test.ts
          resource_report="${binaries[0]}.resource-report.json"
          BLACKGLASS_RUST_BINARY="${binaries[0]}" \
            BLACKGLASS_EXPECTED_SOURCE_REVISION="$GITHUB_SHA" \
            BLACKGLASS_RELEASE_TARGET="${{ matrix.target }}" \
            BLACKGLASS_RESOURCE_MODE=cgroup-v2 \
            bun run server:measure "$resource_report"
          binary_sha=$(sha256sum "${binaries[0]}" | cut -d ' ' -f 1)
          jq -e \
            --arg sha "$binary_sha" \
            --arg revision "$GITHUB_SHA" \
            --arg target "${{ matrix.target }}" \
            -f tools/verify-release-resource-report.jq \
            "$resource_report"
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            artifacts/releases/*.tar.gz
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}.resource-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackglass-server-${{ matrix.target }}
          path: |
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}.tar.gz
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}.tar.gz.sha256
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}.sha256
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}.resource-report.json
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blackglass-server-linux-*
          path: incoming
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            $0 == "[package]" { in_package = 1; next }
            in_package && /^\[/ { exit }
            in_package && /^version = "/ {
              sub(/^version = "/, "")
              sub(/"$/, "")
              print
              exit
            }
          ' apps/server-rust/Cargo.toml)
          test -n "$version"
          . ops/release-version.sh
          blackglass_is_supported_release_version "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir release-assets
          cp LICENSE THIRD_PARTY_NOTICES.md release-assets/
          for architecture in amd64 arm64; do
            base="blackglass-server-v${version}-linux-${architecture}"
            for filename in \
              "$base.tar.gz" \
              "$base.tar.gz.sha256" \
              "$base" \
              "$base.sha256" \
              "$base.resource-report.json"; do
              matches=()
              mapfile -d '' -t matches < <(find incoming -type f -name "$filename" -print0)
              test "${#matches[@]}" -eq 1
              cp -- "${matches[0]}" "release-assets/$filename"
            done
            binary_sha=$(sha256sum "release-assets/$base" | cut -d ' ' -f 1)
            jq -e \
              --arg sha "$binary_sha" \
              --arg revision "$GITHUB_SHA" \
              --arg target "linux-${architecture}" \
              -f tools/verify-release-resource-report.jq \
              "release-assets/$base.resource-report.json"
          done
          test "$(find release-assets -type f -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find release-assets -type f -name '*.tar.gz.sha256' | wc -l)" -eq 2
          test "$(find release-assets -type f -name '*.resource-report.json' | wc -l)" -eq 2
          cd release-assets
          sha256sum ./LICENSE ./THIRD_PARTY_NOTICES.md ./*.tar.gz ./blackglass-server-v*-linux-amd64 ./blackglass-server-v*-linux-arm64 ./*.resource-report.json > SHA256SUMS
          sha256sum -c ./*.tar.gz.sha256
          sha256sum -c ./blackglass-server-v*-linux-*.sha256
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'IMAGE=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Sign in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish multi-architecture image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ops/publish-oci-version.sh \
            "$VERSION" \
            "$IMAGE" \
            "$GITHUB_SHA" \
            release-assets
      - name: Finalize release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          temporary=$(mktemp)
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$temporary"
          mv "$temporary" SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/*
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
      - name: Create or resume verified GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' -t release_files < <(
            find release-assets -maxdepth 1 -type f -print0 | sort -z
          )
          test "${#release_files[@]}" -eq 14
          bash ops/publish-release.sh \
            "$GITHUB_REF_NAME" \
            "Blackglass Server $VERSION" \
            "${release_files[@]}"
      - name: Promote verified stable release to latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ops/promote-oci-latest.sh \
            "$VERSION" \
            "$IMAGE" \
            "$IMAGE_DIGEST"
