name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    name: Full release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.92.0
      - run: npm ci
      - run: bun run check
      - run: ./ops/build-release.sh
      - run: bun run server:measure
      - run: shellcheck ops/*.sh
      - name: Verify systemd hardening unit
        run: |
          sudo systemd-sysusers ops/blackglass-server.sysusers.conf
          systemd-analyze verify ops/blackglass-server.service
      - name: Validate example Caddy ingress
        run: >-
          docker run --rm
          -v "$PWD/ops/Caddyfile.example:/etc/caddy/Caddyfile:ro"
          caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  package:
    name: Package ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: npm ci
      - run: ./ops/build-linux-release.sh "${{ matrix.target }}"
      - name: Qualify the exact exported binary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t binaries < <(find artifacts/releases -maxdepth 1 -type f -name "blackglass-server-v*-${{ matrix.target }}")
          test "${#binaries[@]}" -eq 1
          chmod 0555 "${binaries[0]}"
          BLACKGLASS_RUST_BINARY="${binaries[0]}" \
            BLACKGLASS_EXPECTED_SOURCE_REVISION="$GITHUB_SHA" \
            bun test \
              tests/rust-server.integration.test.ts \
              tests/database-migration.integration.test.ts \
              tests/server-parity.integration.test.ts
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            artifacts/releases/*.tar.gz
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackglass-server-${{ matrix.target }}
          path: |
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}.tar.gz
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}.tar.gz.sha256
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}
            artifacts/releases/blackglass-server-v*-${{ matrix.target }}.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blackglass-server-linux-*
          path: incoming
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            $0 == "[package]" { in_package = 1; next }
            in_package && /^\[/ { exit }
            in_package && /^version = "/ {
              sub(/^version = "/, "")
              sub(/"$/, "")
              print
              exit
            }
          ' apps/server-rust/Cargo.toml)
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir release-assets
          find incoming -type f -name '*.tar.gz' -exec cp '{}' release-assets/ \;
          find incoming -type f -name '*.tar.gz.sha256' -exec cp '{}' release-assets/ \;
          for architecture in amd64 arm64; do
            find incoming -type f -name "blackglass-server-v${version}-linux-${architecture}" -exec cp '{}' release-assets/ \;
            find incoming -type f -name "blackglass-server-v${version}-linux-${architecture}.sha256" -exec cp '{}' release-assets/ \;
            test -f "release-assets/blackglass-server-v${version}-linux-${architecture}"
            test -f "release-assets/blackglass-server-v${version}-linux-${architecture}.sha256"
          done
          test "$(find release-assets -type f -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find release-assets -type f -name '*.tar.gz.sha256' | wc -l)" -eq 2
          cd release-assets
          sha256sum ./*.tar.gz ./blackglass-server-v*-linux-amd64 ./blackglass-server-v*-linux-arm64 > SHA256SUMS
          sha256sum -c ./*.tar.gz.sha256
          sha256sum -c ./blackglass-server-v*-linux-*.sha256
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'IMAGE=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/*
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Sign in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish multi-architecture image
        shell: bash
        run: |
          set -euo pipefail
          existing_version=0
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            existing_version=1
          fi
          image_tags=(--tag "$IMAGE:$VERSION")
          if [[ "$VERSION" != *-* ]]; then
            image_tags+=(--tag "$IMAGE:latest")
          fi
          image_sources=()
          for architecture in amd64 arm64; do
            archive="release-assets/blackglass-server-v${VERSION}-linux-${architecture}.tar.gz"
            raw_binary="release-assets/blackglass-server-v${VERSION}-linux-${architecture}"
            ./ops/verify-linux-release.sh "linux-${architecture}" "$archive" "$raw_binary"
            if [[ "$existing_version" -eq 1 ]]; then
              docker pull --platform "linux/${architecture}" "$IMAGE:$VERSION"
              existing_container=$(docker create --platform "linux/${architecture}" "$IMAGE:$VERSION")
              docker cp "$existing_container:/usr/local/bin/blackglass-server" "existing-${architecture}"
              docker rm "$existing_container"
              cmp "$raw_binary" "existing-${architecture}"
              docker image inspect "$IMAGE:$VERSION" > "existing-${architecture}-image.json"
              jq -e --arg version "$VERSION" --arg revision "$GITHUB_SHA" '
                .[0].Config.User == "65532:65532" and
                .[0].Config.Entrypoint == ["/usr/local/bin/blackglass-server"] and
                .[0].Config.Labels["org.opencontainers.image.version"] == $version and
                .[0].Config.Labels["org.opencontainers.image.revision"] == $revision
              ' "existing-${architecture}-image.json"
              continue
            fi
            context="image-context/${architecture}"
            mkdir -p "${context}/state"
            cp "$raw_binary" "${context}/blackglass-server"
            chmod 0555 "${context}/blackglass-server"
            touch "${context}/state/.blackglass-state"
            metadata="image-metadata-${architecture}.json"
            docker buildx build \
              --platform "linux/${architecture}" \
              --file ops/Dockerfile.prebuilt \
              --build-arg "TARGETARCH=${architecture}" \
              --build-arg "VERSION=$VERSION" \
              --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
              --provenance=false \
              --metadata-file "$metadata" \
              --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
              "$context"
            architecture_digest=$(jq -r '."containerimage.digest"' "$metadata")
            test "$architecture_digest" != null
            image_sources+=("${IMAGE}@${architecture_digest}")
          done
          if [[ "$existing_version" -eq 0 ]]; then
            docker buildx imagetools create "${image_tags[@]}" "${image_sources[@]}"
          fi
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' > image-manifest.json
          jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"]' image-manifest.json
          digest=$(jq -r '.digest' image-manifest.json)
          test "$digest" != null
          if [[ "$VERSION" != *-* && "$existing_version" -eq 1 ]]; then
            if docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' > latest-image-manifest.json 2>/dev/null; then
              test "$(jq -r '.digest' latest-image-manifest.json)" = "$digest"
            else
              docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
            fi
          fi
          printf 'IMAGE_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
      - name: Create or resume immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Blackglass Server $VERSION"
          fi
          mkdir -p existing-release-assets
          for asset in release-assets/*; do
            name=$(basename "$asset")
            if gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
              --jq '.assets[].name' | grep -Fqx "$name"; then
              gh release download "$GITHUB_REF_NAME" \
                --pattern "$name" \
                --dir existing-release-assets
              cmp "$asset" "existing-release-assets/$name"
            else
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          done
          find release-assets -maxdepth 1 -type f -exec basename '{}' \; | sort > expected-release-assets.txt
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.assets[].name' | sort > actual-release-assets.txt
          diff -u expected-release-assets.txt actual-release-assets.txt
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
