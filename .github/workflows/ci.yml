name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.92.0
      - run: npm ci
      - run: bun run check
      - run: ./ops/build-release.sh
      - run: bun run server:measure
      - run: shellcheck ops/*.sh
      - name: Verify systemd hardening unit
        run: |
          sudo systemd-sysusers ops/blackglass-server.sysusers.conf
          systemd-analyze verify ops/blackglass-server.service
      - name: Validate example Caddy ingress
        run: >-
          docker run --rm
          -v "$PWD/ops/Caddyfile.example:/etc/caddy/Caddyfile:ro"
          caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          .github/workflows/ci.yml
          .github/workflows/release.yml
