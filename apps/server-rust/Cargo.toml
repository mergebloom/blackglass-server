[package]
name = "blackglass-server"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
hex = "0.4"
password-hash = { version = "0.5", features = ["getrandom"] }
rand = "0.8"
rusqlite = { version = "0.37", features = ["backup", "blob", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
